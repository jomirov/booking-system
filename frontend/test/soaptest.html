<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form-login">
        <input id="email" name="email" placeholder="email">
        <input id="password" name="password" placeholder="password">
        <button type="submit">Submit</button>
    </form>
    <button id="show-users">Show users</button>
    <ul id="users-list">

    </ul>
    <script>
        
        form_login = document.getElementById("form-login");
        form_login.addEventListener("submit", async (e) => {
            e.preventDefault();
            form_data = new FormData();
            email = document.getElementById("email").value;
            password = document.getElementById("password").value;
            form_data.append("username", email);
            form_data.append("password", password);

            response = await fetch("http://localhost:8000/token", {
                method: "POST",
                body: form_data,
                credentials: "include"
            });

            window.location.href = "http://localhost:8000/users/me"
        })

        document.getElementById("show-users").addEventListener("click", async () => {
            xml_body = `
                <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope"
                        xmlns:tns="http://localhost:8000/api/users/xml">
                    <soap:Body>
                        <tns:show_users>
                        </tns:show_users>
                    </soap:Body>
                </soap:Envelope>
            `;
            response = await fetch("http://localhost:8000/api/users/xml", {
                method: "POST",
                headers: {"Content-Type": "application/xml"},
                body: xml_body
            })
            
            document.getElementById("users-list").innerHTML += await response.text()
        })
    </script>
</body>
</html>
